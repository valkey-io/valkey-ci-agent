repos:
  - repo: valkey-io/valkey
    project_owner: valkey-io
    project_owner_type: organization
    language: c
    validation_setup_commands:
      - "sudo apt-get update && sudo apt-get install -y clang-format-18 libssl-dev tcl8.6 tclx"
      - "python3 -m pip install -r utils/req-res-validator/requirements.txt"
    build_commands:
      - "make -j$(nproc) BUILD_TLS=yes"
    validation_profile: valkey-core
    validation_rules:
      - paths:
          - "src/rdb.c"
          - "src/rio.c"
          - "src/t_stream.c"
          - "src/stream.h"
          - "src/listpack.c"
        commands:
          - "./runtest --single unit/dump --clients 1"
      - paths:
          - "src/tls.c"
          - "src/tls.h"
        commands:
          - "./runtest --single unit/tls --clients 1"
    generated_file_rules:
      - paths:
          - "src/unit/*.c"
          - "utils/generate-unit-test-header.py"
        command: "python3 utils/generate-unit-test-header.py"
        outputs:
          - "src/unit/test_files.h"
    repair_validation_failures: true
    automatic_ci_followup: true
    ci_followup_ignored_jobs:
      - "*dco*"
      - "*developer certificate of origin*"
    backport_label: backport
    llm_conflict_label: ai-resolved-conflicts
    max_conflicting_files: 100
    branches:
      - branch: "7.2"
        project_number: 1
      - branch: "8.0"
        project_number: 2
      - branch: "8.1"
        project_number: 14
      - branch: "9.0"
        project_number: 18
      - branch: "9.1"
        project_number: 41

  - repo: valkey-io/valkey-search
    project_owner: valkey-io
    project_owner_type: organization
    language: c++
    # Use the upstream devcontainer image because release branches depend on
    # its system packages; --privileged mirrors the repository's CI container.
    validation_setup_commands:
      - "docker build -t valkey-search-backport -f .devcontainer/Dockerfile ."
    build_commands:
      - "docker run --privileged --rm -v \"$(pwd):/workspace\" --user \"ubuntu:ubuntu\" valkey-search-backport sudo ci/build_ubuntu.sh"
    test_path_patterns:
      - "testing/*.cc"
      - "vmsdk/testing/*.cc"
      - "integration/test_*.py"
    repair_validation_failures: true
    backport_label: backport
    llm_conflict_label: ai-resolved-conflicts
    max_conflicting_files: 100
    branches:
      - branch: "1.0"
        project_number: 36
      - branch: "1.1"
        project_number: 34
      - branch: "1.2"
        project_number: 58
