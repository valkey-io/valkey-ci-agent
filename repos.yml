repos:
  - repo: valkey-io/valkey
    project_owner: valkey-io
    project_owner_type: organization
    language: c
    validation_setup_commands:
      # tcl-tls is what `./runtest --tls` needs; tests/unit/tls.tcl silently
      # skips its whole body without it.
      # src/unit/Makefile resolves both gtest and gmock through pkg-config before
      # any C++ unit test can compile.
      - "sudo apt-get update && sudo apt-get install -y libssl-dev libgtest-dev libgmock-dev tcl8.6 tclx tcl-tls"
      # Match upstream's exact formatter release instead of whichever build
      # the runner's distribution happens to package.
      - "python3 -m pip install clang-format==18.1.8"
      - "python3 -m pip install -r utils/req-res-validator/requirements.txt"
      # Certificates for the valkey-core profile's TLS checks. Runs once per
      # branch and writes only to the gitignored tests/tls/.
      - "./utils/gen-test-certs.sh"
    # Pin SERVER_CFLAGS as upstream CI does. Otherwise src/Makefile reuses the
    # previous candidate's -DLOG_REQ_RES flags from the shared worktree.
    # Rebuild the Lua engine from scratch: src/Makefile skips its sub-make
    # once the archive exists, and the sub-make does not track headers (9.1+).
    # Build with libc malloc first, as the libc-malloc and sanitizer jobs do:
    # the jemalloc headers include <stdbool.h>, so a file that uses bool
    # without it compiles only with jemalloc (#5128 broke 8.0 and 8.1 so).
    # Pin BUILD_TLS too: the shared worktree's src/.make-settings can retain
    # BUILD_TLS=yes, but that makefile value is not passed to the recursive
    # dependency build, leaving src expecting a libvalkey_tls.a it did not build.
    build_commands:
      - "rm -f src/modules/lua/*.o src/modules/lua/*.a src/modules/lua/*.so"
      - "make -j$(nproc) MALLOC=libc BUILD_TLS=no SERVER_CFLAGS='-Werror'"
      - "make -j$(nproc) BUILD_TLS=yes SERVER_CFLAGS='-Werror'"
    validation_profile: valkey-core
    generated_file_rules:
      - paths:
          - "src/unit/*.c"
          - "utils/generate-unit-test-header.py"
        command: "python3 utils/generate-unit-test-header.py"
        outputs:
          - "src/unit/test_files.h"
    repair_validation_failures: true
    automatic_ci_followup: true
    ci_followup_ignored_jobs:
      # Only Actions job names are matched. DCO and Codecov reach the PR as check
      # runs owned by their own GitHub Apps, never as jobs of a workflow run, so
      # they are already out of reach; the patterns below stay as a cheap guard
      # in case either is ever reimplemented as a workflow job.
      - "*dco*"
      - "*developer certificate of origin*"
      # Real informational Actions jobs: two daily.yml aggregators that fail
      # because some other job failed, and the coverage upload.
      - "consolidate-test-failures*"
      - "notify-about-job-results*"
      - "code-coverage*"
    # weekly.yml runs daily.yml's jobs on every release branch: a branch's
    # failures there are fixed on its open sweep PR, like the PR's own.
    ci_followup_release_workflow: weekly.yml
    backport_label: backport
    llm_conflict_label: ai-resolved-conflicts
    max_conflicting_files: 100
    branches:
      - branch: "7.2"
        project_number: 1
      - branch: "8.0"
        project_number: 2
      - branch: "8.1"
        project_number: 14
      - branch: "9.0"
        project_number: 18
      - branch: "9.1"
        project_number: 41
      - branch: "9.2"
        project_number: 51

  - repo: valkey-io/valkey-search
    project_owner: valkey-io
    project_owner_type: organization
    language: c++
    # Use the upstream devcontainer image because release branches depend on
    # its system packages; --privileged mirrors the repository's CI container.
    validation_setup_commands:
      - "docker build -t valkey-search-backport -f .devcontainer/Dockerfile ."
    build_commands:
      - "docker run --privileged --rm -v \"$(pwd):/workspace\" --user \"ubuntu:ubuntu\" valkey-search-backport sudo ci/build_ubuntu.sh"
    test_path_patterns:
      - "testing/*.cc"
      - "vmsdk/testing/*.cc"
      - "integration/test_*.py"
    repair_validation_failures: true
    backport_label: backport
    llm_conflict_label: ai-resolved-conflicts
    max_conflicting_files: 100
    branches:
      - branch: "1.0"
        project_number: 36
      - branch: "1.1"
        project_number: 34
      - branch: "1.2"
        project_number: 58
      - branch: "1.3"
        project_number: 69
