name: Backport Eligibility

# Once a day, for each repository in the schedule matrix below, look at every
# PR merged to the development branch on the last seven UTC days and comment
# on the ones that look eligible for backport, naming the release branches.
# The overlap re-covers days a failed or skipped run missed (GitHub drops
# scheduled runs now and then). Each PR is judged
# once: the result files of earlier runs settle the PRs they already decided,
# and the marker comment keeps a PR from being commented on twice. It only
# suggests: nothing is added to a project.

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository from repos.yml"
        required: false
        type: string
        default: "valkey-io/valkey"
      date:
        description: "Last UTC merge date YYYY-MM-DD (empty = yesterday)"
        required: false
        type: string
        default: ""
      prs:
        description: "Merged PR numbers to evaluate instead of dates, e.g. 4849,4880 (empty = use date/days)"
        required: false
        type: string
        default: ""
      days:
        description: "UTC dates to cover, ending at date"
        required: false
        type: string
        default: "7"
      dry_run:
        description: "Report verdicts without commenting (scheduled runs always comment)"
        required: false
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  eligibility:
    name: "eligibility/${{ matrix.repo }}"
    if: github.repository == 'valkey-io/valkey-ci-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Scheduled runs cover every repository listed here; each must also be
        # in repos.yml. A manual run covers only its repo input.
        repo: ${{ fromJSON(github.event_name == 'schedule' && '["valkey-io/valkey", "valkey-io/valkey-search"]' || format('["{0}"]', inputs.repo || 'valkey-io/valkey')) }}
    concurrency:
      # Runs for one repo are serialized so two runs over the same date cannot
      # both comment; queue: max keeps every pending dispatch instead of only
      # the latest.
      group: backport-eligibility-${{ matrix.repo }}
      cancel-in-progress: false
      queue: max
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      CLAUDE_CODE_USE_BEDROCK: "1"
      TARGET_REPO: ${{ matrix.repo }}
      MERGE_DATE: ${{ inputs.date || '' }}
      MERGE_DAYS: ${{ inputs.days || '7' }}
      PR_NUMBERS: ${{ inputs.prs || '' }}
      # Scheduled runs comment. A manual run follows its input, which
      # defaults to a dry run so a backfill over old dates posts nothing.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'true' || 'false') || 'false' }}
    permissions:
      # actions: read lists this workflow's earlier runs and downloads their
      # result files.
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent
        with:
          install-claude: "true"

      - name: Resolve target repository
        id: target
        shell: bash
        run: |
          set -euo pipefail
          echo "owner=${TARGET_REPO%%/*}" >> "${GITHUB_OUTPUT}"
          echo "name=${TARGET_REPO#*/}" >> "${GITHUB_OUTPUT}"

      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-contents: read
          # Commenting on a PR needs pull-requests:write; issues:write is not needed.
          permission-pull-requests: write
          permission-organization-projects: read
          permission-metadata: read

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: backport-eligibility-${{ github.run_id }}-${{ steps.target.outputs.name }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download earlier results
        # Best effort: a result that cannot be read only means its PRs are
        # judged again; the marker comment still prevents a second comment.
        # A run holds one result per repository, and the pattern also matches
        # the older unsuffixed name; results for other repositories are
        # ignored when loaded.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p prior-results
          runs=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow backport-eligibility.yml \
            --status completed --limit 30 --json databaseId --jq '.[].databaseId') || runs=""
          found=0
          for id in ${runs}; do
            if gh run download "${id}" --repo "${GITHUB_REPOSITORY}" \
                --pattern "backport-eligibility-result-${id}*" --dir "prior-results/${id}" >/dev/null 2>&1; then
              found=$((found + 1))
            fi
          done
          echo "Downloaded ${found} earlier result file(s)"

      - name: Evaluate merged PRs
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail
          args=(--registry repos.yml --repo "${TARGET_REPO}" --days "${MERGE_DAYS}" --verbose
                --prior-results prior-results --output backport-eligibility-result.json)
          if [[ -n "${MERGE_DATE}" ]]; then
            args+=(--date "${MERGE_DATE}")
          fi
          if [[ -n "${PR_NUMBERS}" ]]; then
            args+=(--prs "${PR_NUMBERS}")
          fi
          if [[ "${DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python -m scripts.backport.eligibility "${args[@]}"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backport-eligibility-result-${{ github.run_id }}-${{ steps.target.outputs.owner }}-${{ steps.target.outputs.name }}
          path: backport-eligibility-result.json
          if-no-files-found: ignore
          retention-days: 30
