name: CI Fix Bot

# A maintainer comments "@valkeyrie-ops fix [<run-or-job-url>] [hint]" on a
# Valkey PR; the comment poller dispatches this workflow. It may also be run
# manually while the feature is being trialled.
#
# The fix runs like every other (ci-fix-run.yml): planned against the PR's
# exact failed job, prepared inside the Valkey job that failed when it
# can host it, and published to a bot-owned branch, or as a suggestion for a
# contributor's branch, which is never pushed. Normal target CI and a human
# merge decide the rest.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "PR repository, e.g. valkey-io/valkey"
        required: true
        type: string
      pr:
        description: "PR number"
        required: true
        type: number
      run_url:
        description: "Failed run/job URL (empty = choose the most actionable current-head failure)"
        required: false
        type: string
        default: ""
      hint:
        description: "Optional diagnosis hint"
        required: false
        type: string
        default: ""
      commenter:
        description: "Requesting user (trusted only when forwarded by the poller App)"
        required: false
        type: string
        default: ""
      comment_id:
        description: "Triggering comment id"
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  ci-fix:
    if: github.repository == 'valkey-io/valkey-ci-agent'
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ci-fix-${{ inputs.repo }}-${{ inputs.pr }}
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/ci-fix-run.yml
    with:
      front_door: pr
      # The commenter is trusted only when the poller App started the run
      # (scripts/ci_fix/main.py).
      request: ${{ toJSON(inputs) }}
      key: pr-${{ inputs.pr }}
    secrets:
      VALKEYRIE_BOT_APP_ID: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
      VALKEYRIE_BOT_PRIVATE_KEY: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
