name: CI Fix Eval
run-name: "CI fix eval ${{ inputs.case }}"

# Replays one failure whose fix is known (scripts/ci_fix/eval_cases.yml) and
# compares what the CI fix bot prepares with that fix (scripts/ci_fix/eval.py).
#
# The fix runs exactly as a real one does, through ci-fix-run.yml: planned
# from the failed job's own workflow file, then prepared inside that job (its
# runner, macOS or Ubuntu; its container; its setup, build and test commands)
# or on the bot's runner when the job cannot host it.
#
# Nothing is published: ci-fix-run.yml plans a replayed failure with this
# workflow's read-only token and skips its publish job, the App's secrets are
# not passed, and scripts/ci_fix/run.py refuses to publish an eval plan.
#
# One run is one case, and one case is a model session of up to hours: start
# the cases you want, one run each.
on:
  workflow_dispatch:
    inputs:
      case:
        description: "A case id from scripts/ci_fix/eval_cases.yml"
        required: true
        type: string

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fix:
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-fix-run.yml
    with:
      front_door: eval
      request: ${{ format('{{"case":{0}}}', toJSON(inputs.case)) }}
      key: eval-${{ inputs.case }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  score:
    name: "Score the replay (${{ inputs.case }})"
    needs: fix
    # A fix that failed or refused is a result too.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent

      - name: Download the fix
        # A fix job that crashed uploaded nothing; the score says so.
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ci-fix-result-eval-${{ inputs.case }}
          path: ci-fix-result

      - name: Compare the candidate with the known fix
        shell: bash
        env:
          # Reads the known fix's pull request. Nothing is written anywhere.
          TARGET_TOKEN: ${{ github.token }}
          CASE: ${{ inputs.case }}
        run: python -m scripts.ci_fix.eval score --case "${CASE}" --outcome ci-fix-result --out ci-fix-score

      - name: Upload the score
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-fix-eval-score
          path: ci-fix-score/
          retention-days: 30
          overwrite: true
