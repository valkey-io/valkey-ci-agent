name: Agent Fix CI Issues

# One run handles one Test Failure Detector issue and, when a fix is
# accepted, posts it on the issue as a patch, or opens or updates a draft PR
# when AGENT_FIX_CI_ISSUES_PUBLISH is draft-pr. A maintainer, or the draft PR's own
# CI and human review, decide whether it is merged; this workflow never merges.
# The fix runs like every other (agent-fix-run.yml), inside the Valkey job that
# failed when it can host it.
# agent-fix-ci-issue-dispatch.yml finds an issue's active runs by this name, and
# counts its failed attempts for an occurrence, which are never commented.
run-name: "Agent fix CI issue #${{ inputs.issue }}${{ inputs.run_id && format(' (run {0})', inputs.run_id) || '' }}"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Test Failure Detector issue number"
        required: true
        type: number
      run_id:
        description: "The occurrence's run id (set by the dispatcher; 0 for a manual run)"
        required: false
        type: number
        default: 0

permissions: {}

concurrency:
  group: agent-fix-issue-${{ inputs.issue }}
  cancel-in-progress: false
  queue: max

jobs:
  fix:
    if: github.repository == 'valkey-io/valkey-ci-agent'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/agent-fix-run.yml
    with:
      front_door: issue
      request: ${{ format('{{"repo":"valkey-io/valkey","issue":{0}}}', inputs.issue) }}
      key: issue-${{ inputs.issue }}
    secrets:
      VALKEYRIE_BOT_APP_ID: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
      VALKEYRIE_BOT_PRIVATE_KEY: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
