name: Backport CI Follow-up

# Find one current-head failure on an open bot-owned PR into each enabled
# branch, and fix it like every other failure (ci-fix-run.yml): prepared
# inside the Valkey job that failed when it can host it, pushed to the
# bot's branch, and verified by the target PR's normal CI. Only repositories
# whose registry entry enables automatic_ci_followup are followed up.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "Filter to this repository (empty = all enabled repos)"
        required: false
        type: string
        default: ""
      project_number:
        description: "Filter to this project number (empty = all)"
        required: false
        type: string
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  preflight:
    name: Generate matrix
    if: github.repository == 'valkey-io/valkey-ci-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_entries: ${{ steps.matrix.outputs.has_entries }}
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent

      - name: Generate enabled branch matrix
        id: matrix
        shell: bash
        env:
          REPO_FILTER: ${{ inputs.repo || '' }}
          PROJECT_FILTER: ${{ inputs.project_number || '' }}
        run: |
          set -euo pipefail
          args=(--registry repos.yml --automatic-ci-followup-only)
          if [[ -n "${REPO_FILTER}" ]]; then
            args+=(--repo "${REPO_FILTER}")
          fi
          if [[ -n "${PROJECT_FILTER}" ]]; then
            args+=(--project-number "${PROJECT_FILTER}")
          fi
          python -m scripts.backport.matrix "${args[@]}" --output-file "$GITHUB_OUTPUT"

  follow-up:
    name: "follow-up/${{ matrix.repo }}/${{ matrix.branch }}"
    needs: preflight
    if: needs.preflight.outputs.has_entries == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.preflight.outputs.matrix) }}
    concurrency:
      group: backport-branch-mutation-${{ matrix.repo }}-${{ matrix.branch }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-fix-run.yml
    with:
      front_door: follow-up
      request: ${{ format('{{"repo":"{0}","branch":"{1}"}}', matrix.repo, matrix.branch) }}
      key: ${{ matrix.repo_slug }}-${{ matrix.branch }}
      target_owner: ${{ matrix.repo_owner }}
      target_repo: ${{ matrix.repo_name }}
    secrets:
      VALKEYRIE_BOT_APP_ID: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
      VALKEYRIE_BOT_PRIVATE_KEY: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
