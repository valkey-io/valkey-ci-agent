name: Backport CI Follow-up

# Open sweep PRs are otherwise invisible to the backport poller until they
# merge. This workflow watches their current heads and gives one unhandled,
# actionable CI failure to the existing verified CI-fix engine.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "Filter to this repository (empty = all enabled repos)"
        required: false
        type: string
        default: ""
      project_number:
        description: "Filter to this project number (empty = all)"
        required: false
        type: string
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  preflight:
    name: Generate matrix
    if: github.repository == 'valkey-io/valkey-ci-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_entries: ${{ steps.matrix.outputs.has_entries }}
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent

      - name: Generate enabled branch matrix
        id: matrix
        shell: bash
        env:
          REPO_FILTER: ${{ inputs.repo || '' }}
          PROJECT_FILTER: ${{ inputs.project_number || '' }}
        run: |
          set -euo pipefail
          args=(--registry repos.yml --automatic-ci-followup-only)
          if [[ -n "${REPO_FILTER}" ]]; then
            args+=(--repo "${REPO_FILTER}")
          fi
          if [[ -n "${PROJECT_FILTER}" ]]; then
            args+=(--project-number "${PROJECT_FILTER}")
          fi
          python -m scripts.backport.matrix "${args[@]}" --output-file "$GITHUB_OUTPUT"

  follow-up:
    name: "follow-up/${{ matrix.repo }}/${{ matrix.branch }}"
    needs: preflight
    if: needs.preflight.outputs.has_entries == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.preflight.outputs.matrix) }}
    concurrency:
      group: backport-ci-followup-${{ matrix.repo }}-${{ matrix.branch }}
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      CLAUDE_CODE_USE_BEDROCK: "1"
      CI_AGENT_EVIDENCE_DIR: agent-evidence
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent
        with:
          install-claude: "true"

      - name: Generate target repository token
        id: target-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: ${{ matrix.repo_owner }}
          repositories: ${{ matrix.repo_name }}
          permission-actions: read
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write
          permission-issues: write
          permission-metadata: read

      - name: Generate agent repository token
        id: agent-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: valkey-io
          repositories: valkey-ci-agent
          permission-actions: write
          permission-metadata: read

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: backport-ci-followup-${{ github.run_id }}-${{ matrix.branch }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Follow up on current-head CI
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.target-token.outputs.token }}
          AUTO_CI_FOLLOWUP_BOT_LOGIN: ${{ steps.target-token.outputs.app-slug }}[bot]
          CI_FIX_MACOS_AGENT_REPO: valkey-io/valkey-ci-agent
          CI_FIX_MACOS_AGENT_REF: main
          CI_FIX_MACOS_TOKEN: ${{ steps.agent-token.outputs.token }}
          CI_FIX_VERIFY_RUNS: ${{ vars.CI_FIX_VERIFY_RUNS || '2' }}
        run: |
          set -euo pipefail
          python -m scripts.backport.ci_followup \
            --registry repos.yml \
            --repo "${{ matrix.repo }}" \
            --branch "${{ matrix.branch }}" \
            --verbose | tee backport-ci-followup-result.json

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backport-ci-followup-${{ github.run_id }}-${{ matrix.repo_slug }}-${{ matrix.branch }}
          path: backport-ci-followup-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload agent evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backport-ci-followup-evidence-${{ github.run_id }}-${{ matrix.repo_slug }}-${{ matrix.branch }}
          path: agent-evidence
          if-no-files-found: ignore
          retention-days: 30
