name: Backport Poll

# Runs the backport poller on a short cadence. For each registered
# {repo, branch} the poller runs a sweep only when no sweep PR is currently
# open for that branch, so a merged sweep PR is topped back up within one poll
# interval instead of waiting for the daily Backport Sweep cron.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "Filter to this repository (empty = all repos in registry)"
        required: false
        type: string
        default: ""
      project_number:
        description: "Filter to this project number (empty = all)"
        required: false
        type: string
        default: ""
      max_candidates:
        description: "Cap successfully applied cherry-picks per branch (0 = unlimited)"
        required: false
        type: string
        default: "2"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  preflight:
    name: "Generate matrix"
    if: github.repository == 'valkey-io/valkey-ci-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_entries: ${{ steps.matrix.outputs.has_entries }}
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent

      - name: Generate matrix from registry
        id: matrix
        shell: bash
        env:
          REPO_FILTER: ${{ inputs.repo || '' }}
          PROJECT_FILTER: ${{ inputs.project_number || '' }}
        run: |
          set -euo pipefail
          args=(--registry repos.yml)
          if [[ -n "${REPO_FILTER}" ]]; then
            args+=(--repo "${REPO_FILTER}")
          fi
          if [[ -n "${PROJECT_FILTER}" ]]; then
            args+=(--project-number "${PROJECT_FILTER}")
          fi
          python -m scripts.backport.matrix "${args[@]}" --output-file "$GITHUB_OUTPUT"

  poll:
    name: "poll/${{ matrix.repo }}/${{ matrix.branch }}"
    needs: preflight
    if: needs.preflight.outputs.has_entries == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.preflight.outputs.matrix) }}
    concurrency:
      # Shared by every workflow that mutates the rolling sweep branch.
      group: backport-branch-mutation-${{ matrix.repo }}-${{ matrix.branch }}
      cancel-in-progress: false
      queue: max
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      CLAUDE_CODE_USE_BEDROCK: "1"
      CI_AGENT_EVIDENCE_DIR: agent-evidence
      MAX_CANDIDATES: ${{ inputs.max_candidates || '2' }}
      POLL_INTERVAL_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '0' }}
      POLL_DURATION_SECONDS: ${{ github.event_name == 'schedule' && '3300' || '0' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out agent repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up agent dependencies
        uses: ./.github/actions/setup-agent
        with:
          install-claude: "true"

      - name: Configure runtime paths
        shell: bash
        run: echo "SWEEP_STATE_FILE=${RUNNER_TEMP}/backport-sweep/state.json" >> "${GITHUB_ENV}"

      - name: Generate polling token
        id: poll-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: ${{ matrix.repo_owner }}
          repositories: ${{ matrix.repo_name }}
          permission-pull-requests: read
          permission-metadata: read

      - name: Check for sweep work
        id: poll
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.poll-token.outputs.token }}
        run: |
          set -euo pipefail
          poll() {
            python -m scripts.backport.poller \
              --registry repos.yml \
              --repo "${{ matrix.repo }}" \
              --branch "${{ matrix.branch }}" \
              --max-candidates "${MAX_CANDIDATES}" \
              --dry-run \
              --verbose
          }

          poll_once() {
            poll > backport-poll-result.json &&
              python -c 'import json; print(json.load(open("backport-poll-result.json"))["action"])'
          }

          poll_started=${SECONDS}
          poll_had_error=false
          if action=$(poll_once); then
            :
          else
            poll_had_error=true
            action=error
          fi
          if [[ "${action}" != "would-sweep" \
                && "${POLL_INTERVAL_SECONDS}" -gt 0 \
                && "${POLL_DURATION_SECONDS}" -ge "${POLL_INTERVAL_SECONDS}" ]]; then
            wait=$((POLL_INTERVAL_SECONDS - (SECONDS - poll_started)))
            (( wait <= 0 )) || sleep "${wait}"
            if action=$(poll_once); then
              :
            else
              poll_had_error=true
              action=error
            fi
          fi

          cat backport-poll-result.json
          [[ "${action}" == "would-sweep" ]] && sweep=true || sweep=false
          echo "needs_sweep=${sweep}" >> "${GITHUB_OUTPUT}"
          echo "had_error=${poll_had_error}" >> "${GITHUB_OUTPUT}"

      - name: Generate preparation token
        if: steps.poll.outputs.needs_sweep == 'true'
        id: prepare-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: ${{ matrix.repo_owner }}
          repositories: ${{ matrix.repo_name }}
          permission-contents: read
          permission-pull-requests: read
          permission-organization-projects: read
          permission-metadata: read

      - name: Configure AWS credentials
        if: steps.poll.outputs.needs_sweep == 'true'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: backport-poll-${{ github.run_id }}-${{ matrix.branch }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 10800

      - name: Prepare backport sweep
        if: steps.poll.outputs.needs_sweep == 'true'
        id: prepare
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.prepare-token.outputs.token }}
        run: |
          set -euo pipefail
          python -m scripts.backport.sweep \
            --registry repos.yml \
            --repo "${{ matrix.repo }}" \
            --branch "${{ matrix.branch }}" \
            --max-candidates "${MAX_CANDIDATES}" \
            --prepare-state "${SWEEP_STATE_FILE}" \
            --verbose | tee backport-sweep-result.json
          [[ -f "${SWEEP_STATE_FILE}" ]] && publish=true || publish=false
          echo "needs_publish=${publish}" >> "${GITHUB_OUTPUT}"

      - name: Generate publication token
        if: steps.prepare.outputs.needs_publish == 'true'
        id: publish-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: ${{ matrix.repo_owner }}
          repositories: ${{ matrix.repo_name }}
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write
          permission-issues: write
          permission-metadata: read

      - name: Publish backport sweep
        if: steps.prepare.outputs.needs_publish == 'true'
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.publish-token.outputs.token }}
        run: |
          set -euo pipefail
          python -m scripts.backport.sweep \
            --registry repos.yml \
            --repo "${{ matrix.repo }}" \
            --branch "${{ matrix.branch }}" \
            --publish-state "${SWEEP_STATE_FILE}" \
            --verbose | tee backport-sweep-result.json

      - name: Clean up prepared sweep
        if: always()
        shell: bash
        run: |
          if [[ "${SWEEP_STATE_FILE:-}" == "${RUNNER_TEMP}/backport-sweep/state.json" ]]; then
            # Repository validation may use a container that leaves root-owned
            # build artifacts in the prepared worktree.
            sudo -n rm -rf -- "${RUNNER_TEMP}/backport-sweep"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backport-poll-result-${{ github.run_id }}-${{ matrix.repo_slug }}-${{ matrix.branch }}
          path: |
            backport-poll-result.json
            backport-sweep-result.json
          retention-days: 30

      - name: Upload agent evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backport-poll-agent-evidence-${{ github.run_id }}-${{ matrix.repo_slug }}-${{ matrix.branch }}
          path: agent-evidence
          if-no-files-found: ignore
          retention-days: 30

      - name: Report polling failure
        if: always() && steps.poll.outputs.had_error == 'true'
        shell: bash
        run: |
          echo "One or more backport poll attempts failed; see the uploaded poll result." >&2
          exit 1
