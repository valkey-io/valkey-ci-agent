name: Set up Valkey CI agent
description: Install Python and project dependencies for valkey-ci-agent workflows.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.11"
  install-mode:
    description: "Dependency set to install: runtime or dev."
    required: false
    default: runtime
  install-claude:
    description: Install the Claude Code CLI used by AI-backed agent jobs.
    required: false
    default: "false"
  path:
    description: Where the agent repository is checked out.
    required: false
    default: "."
  system-packages:
    description: >-
      Install Python, Node and the agent account's tools with the system's
      package manager, as root: for a job's container, where setup-python's
      builds may not run and there is no sudo.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Python and Node from the system's packages
      if: ${{ inputs['system-packages'] == 'true' }}
      shell: sh
      run: sh "${GITHUB_ACTION_PATH}/system-packages.sh"

    - name: Set up Python ${{ inputs['python-version'] }}
      if: ${{ inputs['system-packages'] != 'true' }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs['python-version'] }}
        cache: "pip"

    - name: Validate install options
      shell: bash
      env:
        INSTALL_MODE: ${{ inputs['install-mode'] }}
        INSTALL_CLAUDE: ${{ inputs['install-claude'] }}
      run: |
        set -euo pipefail
        case "${INSTALL_MODE}" in
          runtime|dev) ;;
          *)
            echo "::error::install-mode must be 'runtime' or 'dev'"
            exit 1
            ;;
        esac
        case "${INSTALL_CLAUDE}" in
          true|false) ;;
          *)
            echo "::error::install-claude must be 'true' or 'false'"
            exit 1
            ;;
        esac

    - name: Install runtime dependencies
      if: ${{ inputs['install-mode'] == 'runtime' }}
      shell: bash
      working-directory: ${{ inputs.path }}
      run: python -m pip install .

    - name: Install development dependencies
      if: ${{ inputs['install-mode'] == 'dev' }}
      shell: bash
      working-directory: ${{ inputs.path }}
      run: python -m pip install -e ".[dev]"

    - name: Install Claude Code
      if: ${{ inputs['install-claude'] == 'true' }}
      shell: bash
      run: npm install -g @anthropic-ai/claude-code@2.1.175
