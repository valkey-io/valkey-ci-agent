# An excerpt of valkey-io/valkey's .github/workflows/ci.yml at 0704408: the
# jobs the job resolver's tests read (tests/test_ci_fix_ci_job.py), as they
# are there. The workflow's own header is kept whole: the jobs' expressions
# read its inputs and env.
name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - '**/00-RELEASENOTES'
      - '**/COPYING'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/00-RELEASENOTES'
      - '**/COPYING'

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-ubuntu-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Install libbacktrace
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ianlancetaylor/libbacktrace
          ref: b9e40069c0b47a722286b94eb5231f7f05c08713
          path: libbacktrace
      - run: cd libbacktrace && ./configure && make && sudo make install
      - name: Checkout Valkey
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: make
        # Fail build if there are warnings
        # build with TLS just for compilation coverage
        run: |
          sudo apt-get install pkg-config libzstd-dev libgtest-dev libgmock-dev
          make -j4 all-with-unit-tests SERVER_CFLAGS='-Werror' BUILD_TLS=yes BUILD_ZSTD=yes USE_LIBBACKTRACE=yes
      - name: test
        run: |
          sudo apt-get install tcl8.6 tclx
          ./runtest --verbose --tags -slow --dump-logs
      - name: module api test
        run: CFLAGS='-Werror' ./runtest-moduleapi --verbose --dump-logs
      - name: unit tests
        run: |
          make test-unit
